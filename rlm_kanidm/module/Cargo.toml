[package]
name = "rlm_kanidm"
description = "Kanidm FreeRADIUS module core and FFI surface"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "rlm_kanidm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
extern-freeradius-module = ["dep:concread", "dep:kanidm_client", "dep:kanidm_proto", "dep:rlm_kanidm_shared", "dep:tokio", "dep:tracing", "dep:libc"]

[dependencies]
concread = { workspace = true, optional = true }
kanidm_client = { workspace = true, optional = true }
kanidm_proto = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tracing = { workspace = true, optional = true }

rlm_kanidm_shared = { workspace = true, optional = true }

[dev-dependencies]
concread = { workspace = true }
kanidm_client = { workspace = true }
kanidm_proto = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }

rlm_kanidm_shared = { workspace = true }

kanidmd_core = { workspace = true }
kanidmd_testkit = { workspace = true }
url = { workspace = true }

[build-dependencies]
bindgen = "0.73.0"
cc = "^1.2.63"
