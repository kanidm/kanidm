<tr hx-target="this">
  <td><a href="/ui/admin/person/(( person_uuid ))/view" hx-target="#main">(( person_name ))</a></td>
  <td>(( person_mail | assigned_or("—") ))</td>
  <td class="font-monospace text-secondary">(( person_uuid ))</td>
  <td>
    <form hx-target=""
          hx-swap="delete"
          hx-get="/ui/api/admin/person/(( person_uuid ))/remove"
          hx-confirm="Are you sure you wish to delete the person &quot;((person_name))&quot;?">
      <button class="btn btn-tiny btn-danger" id="delete-person-button">Delete</button>
    </form>
  </td>
</tr>
