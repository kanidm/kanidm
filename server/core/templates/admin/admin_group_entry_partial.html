<tr hx-target="this">
    <td class="position-relative">
        <span class="me-1">👥</span>
        <a href="/ui/admin/group/(( group_uuid ))/view" hx-target="#main" 
        class="stretched-link text-decoration-none">(( group_name ))</a>
        <br>&nbsp;
    </td>
    <td class="font-monospace text-secondary d-none d-md-table-cell">(( group_uuid ))</td>
    <td>
        <form hx-swap="delete"
                hx-get="/ui/api/admin/group/(( group_uuid ))/remove"
                hx-confirm="Are you sure you wish to delete the group &quot;((group_name))&quot;?">
            <button class="btn btn-tiny btn-danger" id="delete-group-button">Delete</button>
        </form>
    </td>
</tr>
